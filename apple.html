<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產鑑定報告</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 15px; margin: 0; }
        .box { background: #1c1c1e; padding: 20px; border-radius: 15px; border: 1px solid #333; max-width: 480px; margin: auto; }
        .t { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        label { display: block; font-size: 11px; color: #86868b; margin: 10px 0 5px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; background: #2c2c2e; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 8px; }
        #go { width: 100%; padding: 18px; background: #0071e3; color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #res { display: none; margin-top: 20px; background: #fff; color: #000; border-radius: 12px; padding: 20px; }
        .score { font-size: 54px; font-weight: 900; text-align: center; margin: 5px 0; }
        .adv { background: #f2f2f7; padding: 15px; border-radius: 10px; font-size: 14px; line-height: 1.6; border-left: 6px solid #0071e3; margin-bottom: 10px; }
        .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    </style>
</head>
<body>

<div class="box">
    <div class="t">iPhone 資產價值精算</div>

    <label>1. 設備型號</label>
    <select id="m">
        <optgroup label="iPhone 16 系列">
            <option value="16PM" data-p="44900">iPhone 16 Pro Max</option>
            <option value="16P" data-p="36900">iPhone 16 Pro</option>
            <option value="16PL" data-p="32900">iPhone 16 Plus</option>
            <option value="16" data-p="29900">iPhone 16</option>
        </optgroup>
        <optgroup label="iPhone 15 系列">
            <option value="15PM" data-p="44900">iPhone 15 Pro Max</option>
            <option value="15P" data-p="36900">iPhone 15 Pro</option>
            <option value="15PL" data-p="32900">iPhone 15 Plus</option>
            <option value="15" data-p="29900">iPhone 15</option>
        </optgroup>
        <optgroup label="iPhone 14 系列">
            <option value="14PM" data-p="38900">iPhone 14 Pro Max</option>
            <option value="14P" data-p="34900">iPhone 14 Pro</option>
            <option value="14PL" data-p="31900">iPhone 14 Plus</option>
            <option value="14" data-p="27900">iPhone 14</option>
        </optgroup>
        <optgroup label="iPhone 13 系列">
            <option value="13PM" data-p="36900">iPhone 13 Pro Max</option>
            <option value="13P" data-p="32900">iPhone 13 Pro</option>
            <option value="13" data-p="25900">iPhone 13</option>
            <option value="13mi" data-p="22900">iPhone 13 mini</option>
        </optgroup>
        <optgroup label="iPhone 12 系列">
            <option value="12PM" data-p="37900">iPhone 12 Pro Max</option>
            <option value="12P" data-p="33900">iPhone 12 Pro</option>
            <option value="12" data-p="26900">iPhone 12</option>
            <option value="12mi" data-p="23900">iPhone 12 mini</option>
        </optgroup>
        <optgroup label="iPhone 11 系列">
            <option value="11PM" data-p="39400">iPhone 11 Pro Max</option>
            <option value="11P" data-p="35900">iPhone 11 Pro</option>
            <option value="11" data-p="24900">iPhone 11</option>
        </optgroup>
    </select>

    <div class="row">
        <div style="flex:1"><label>已持有年數</label><input type="number" id="yr" value="2"></div>
        <div style="flex:1"><label>電池健康度 %</label><input type="number" id="ba" value="82"></div>
    </div>

    <div class="row">
        <div style="flex:1">
            <label>外觀狀況</label>
            <select id="co">
                <option value="0">完美無損</option>
                <option value="1">輕微刮傷</option>
                <option value="2">明顯損壞</option>
            </select>
        </div>
        <div style="flex:1">
            <label>後續用途</label>
            <select id="pu">
                <option value="f">送給家人使用</option>
                <option value="b">當備用機</option>
            </select>
        </div>
    </div>

    <label>2. 現場鑑定回收價 (NT$)</label>
    <input type="number" id="pr" placeholder="輸入金額">

    <button id="go" onclick="runCheck()">生成診斷報告</button>

    <div id="res">
        <div class="score" id="sS">0%</div>
        <div style="text-align:center; font-size:11px; color:#86868b; margin-bottom:15px;">資產活化建議指數</div>
        <div class="adv" id="sA"></div>
        <div class="item"><span>預計領回現金</span><b id="sC" style="color:#0071e3; font-size:18px;"></b></div>
        <div class="item"><span>平均每月持有成本</span><b id="sM"></b></div>
    </div>
</div>

<script>
function runCheck() {
    var p = parseFloat(document.getElementById('pr').value);
    if(!p) { alert("請輸入金額"); return; }

    var yr = parseFloat(document.getElementById('yr').value) || 1;
    var mo = yr * 12; 
    var ba = parseInt(document.getElementById('ba').value);
    var sel = document.getElementById('m');
    var modelValue = sel.value; 
    var modelName = sel.options[sel.selectedIndex].text;
    var orig = parseFloat(sel.options[sel.selectedIndex].getAttribute('data-p'));
    var pu = document.getElementById('pu').value;
    
    var ratio = p / orig;
    var score = 0;
    var advice = "";
    var scoreColor = "#0071e3";

    if (modelValue.indexOf('16') !== -1) {
        if (ratio < 0.4) { 
            score = 15; scoreColor = "#ff3b30";
            advice = "<b>【價值評估預警】</b><br>目前的回收價因機況顯著低於資產價值，建議留用。";
        } else if (pu === 'f') {
            score = 92;
            advice = "<b>【高品質資產傳承】</b><br>" + modelName + " 效能頂尖，若家人有需求，留用此機具備極高價值。";
        } else {
            score = 85;
            advice = "<b>【備用機效益評估】</b><br>" + modelName + " 殘值尚高，當備用機將面臨每年數千元的跌價損失。建議考慮結清，年年換新機。";
        }
    } 
    else if (modelValue.indexOf('14') !== -1 || modelValue.indexOf('15') !== -1) {
        if (ba < 80) {
            score = 95;
            advice = "<b>【效能衰退：建議結清】</b><br>電池健康度（" + ba + "%）已過低。現在結清領回 NT$ " + p.toLocaleString() + "，是避免資產與體驗雙輸的最佳選擇。";
        } else if (ba < 85) {
            if (pu === 'f') {
                score = 55; scoreColor = "#ff9500";
                advice = "<b>【留用建議：代送維修】</b><br>若要留給家人，<b>建議由我們代送到授權中心更換電池</b>。但請衡量維修費與等待時間，轉為新機補貼是否更具效益。";
            } else {
                score = 90;
                advice = "<b>【備用機警告】</b><br>電池已不穩定，當備用機時若長期沒電存放，易導致電池膨脹。建議趁現在有鑑定價值時回收。";
            }
        } else {
            score = 80;
            advice = "目前設備狀況良好。您可以選擇繼續使用，或趁二手需求高時回收套現。";
        }
    } 
    else {
        // iPhone 11-13
        score = 98;
        advice = "<b>【強力回收建議】</b><br>此機型已屆退役期。不論用途，現在領回 NT$ " + p.toLocaleString() + " 現金是最高效益。";
        if (pu === 'b') {
            advice += "<br>● <b>備用機效益低</b>：現今維修多可當日完修，舊機存放只會導致零件老化，無實質意義。";
        } else {
            advice += "<br>● <b>送家人負擔大</b>：效能已不符現今 App 需求，且更換電池需額外花費，建議直接變現。";
        }
    }

    var sS = document.getElementById('sS');
    sS.style.color = scoreColor;
    sS.innerText = score + "%";
    document.getElementById('sA').innerHTML = advice;
    document.getElementById('sC').innerText = "NT$ " + p.toLocaleString();
    document.getElementById('sM').innerText = "NT$ " + Math.floor((orig - p)/mo).toLocaleString() + " / 月";
    document.getElementById('res').style.display = "block";
    window.scrollTo(0, document.body.scrollHeight);
}
</script>
</body>
</html>
