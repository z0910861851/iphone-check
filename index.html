<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舊換新價值分析報告 (V32)</title>

<style>
:root {
    --apple-blue: #0071e3;
    --bg-main: #ffffff;
    --card-white: #f5f5f7;
    --text-dark: #1d1d1f;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-main);
    color: var(--text-dark);
    padding: 20px;
    margin: 0;
    display: flex;
    justify-content: center;
}

.box { width: 100%; max-width: 440px; }

.card {
    background: var(--card-white);
    padding: 25px;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    margin-bottom: 20px;
    border: 1px solid #e5e5e7;
}

h2 {
    text-align: center;
    font-weight: 600;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 13px;
    color: #86868b;
    margin-bottom: 8px;
    font-weight: 500;
    padding-left: 4px;
}

select, input {
    width: 100%;
    padding: 14px;
    background: #ffffff;
    border: 1px solid #d2d2d7;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 18px;
    box-sizing: border-box;
}

select:focus, input:focus {
    border-color: var(--apple-blue);
    outline: none;
}

#go {
    width: 100%;
    padding: 18px;
    background: var(--apple-blue);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
}

#res {
    display: none;
    margin-top: 25px;
    background: #fff;
    border-radius: 24px;
    padding: 25px;
    border: 1px solid #e5e5e7;
    animation: slideUp 0.4s ease-out;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.finance-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 15px;
    font-size: 12px;
}

.finance-table th {
    background: #fbfbfd;
    padding: 12px 5px;
    color: #86868b;
    font-weight: 500;
    border-bottom: 1px solid #eee;
}

.finance-table td {
    padding: 14px 5px;
    text-align: center;
    border-bottom: 1px solid #f5f5f7;
}

.model-name {
    font-weight: 700;
    text-align: left !important;
    padding-left: 10px !important;
}

.price-tag {
    color: #d70015;
    font-weight: 600;
}

.daily-blue {
    color: var(--apple-blue);
    font-weight: 800;
    font-size: 15px;
}

#ai-output {
    font-size: 15px;
    line-height: 1.8;
    color: #3a3a3c;
    border-top: 1px solid #f2f2f2;
    padding-top: 20px;
    text-align: justify;
}

.quote {
    font-style: italic;
    color: var(--apple-blue);
    font-weight: 600;
    margin-top: 18px;
    display: block;
    text-align: center;
    font-size: 13px;
}

.admin-section {
    margin-top: 40px;
    padding: 15px;
    border-top: 1px solid #eee;
}

#apiKey { 
    font-size: 12px; 
    background: #fdfdfd; 
}
</style>
</head>

<body>
<div class="box">

<h2>舊換新價值分析報告</h2>

<div class="card">
<label>鑑定舊機型號</label>
<select id="m">
<option>iPhone 16 Pro Max</option>
<option>iPhone 16 Pro</option>
<option>iPhone 16 Plus</option>
<option>iPhone 16</option>
<option>iPhone 15 Pro Max</option>
<option>iPhone 15 Pro</option>
<option>iPhone 15 Plus</option>
<option>iPhone 15</option>
<option>iPhone 14 Pro Max</option>
<option>iPhone 14 Pro</option>
<option>iPhone 14 Plus</option>
<option>iPhone 14</option>
<option>iPhone 13 Pro Max</option>
<option>iPhone 13 Pro</option>
<option>iPhone 13</option>
<option>iPhone 13 mini</option>
<option>iPhone 12 Pro Max</option>
<option>iPhone 12 Pro</option>
<option>iPhone 12</option>
<option>iPhone 12 mini</option>
<option>iPhone 11 Pro Max</option>
<option>iPhone 11 Pro</option>
<option>iPhone 11</option>
</select>

<label>外觀狀態</label>
<select id="cond">
<option>外觀完美 / 無摔無傷</option>
<option>輕微使用痕跡</option>
<option>明顯傷痕 / 掉漆</option>
<option>螢幕或背蓋損壞 (需維修)</option>
</select>

<div style="display:flex; gap:12px;">
<div style="flex:1">
<label>電池健康度 %</label>
<input type="number" id="ba" value="85">
</div>
<div style="flex:1">
<label>舊機回收價 (NT$)</label>
<input type="number" id="pr" placeholder="輸入報價">
</div>
</div>

<button id="go" onclick="runCheck()">開始分析</button>
</div>

<div id="res">
<table class="finance-table">
<thead>
<tr>
<th style="text-align:left;padding-left:10px;">目標新機 (256G)</th>
<th>原價</th>
<th>需補差價</th>
<th>每月 / 每日</th>
</tr>
</thead>
<tbody id="financeBody"></tbody>
</table>

<div style="font-size:11px;color:#999;text-align:center;margin-bottom:10px;">
※ 價格以實際上市公告為準
</div>

<div id="ai-output"></div>
<span class="quote">「使用，才真正賦予價值」</span>
</div>

<div class="admin-section" id="adminArea">
<label>系統設定 (API KEY)</label>
<input type="password" id="apiKey" oninput="saveKey()" placeholder="請貼上 gsk_ 開頭金鑰">
</div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('my_groq_key');
    if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
    }
});

function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key.startsWith('gsk_')) {
        localStorage.setItem('my_groq_key', key);
    }
}

async function runCheck() {
    const key = localStorage.getItem('my_groq_key') || document.getElementById('apiKey').value.trim();
    const tradeIn = parseFloat(document.getElementById('pr').value);
    const model = document.getElementById('m').value;
    const cond = document.getElementById('cond').value;
    const battery = parseInt(document.getElementById('ba').value);

    if (!tradeIn || !key) {
        alert("請輸入回收價並完成金鑰設定");
        return;
    }

    let batteryNote = "";
    if (battery < 80) batteryNote = "（電池已明顯老化）";

    const models = [
        { name: "iPhone 17", price: 29900 },
        { name: "iPhone 17 Pro", price: 39900 },
        { name: "iPhone 17 Pro Max", price: 44900 }
    ];

    const tbody = document.getElementById('financeBody');
    tbody.innerHTML = "";

    models.forEach(m => {
        const gap = m.price - tradeIn;
        const monthly = Math.round(gap / 12);
        const daily = Math.round(gap / 365);
        tbody.innerHTML += `
        <tr>
            <td class="model-name">${m.name}</td>
            <td>$${m.price.toLocaleString()}</td>
            <td class="price-tag">$${gap.toLocaleString()}</td>
            <td>$${monthly.toLocaleString()} / <span class="daily-blue">$${daily}</span></td>
        </tr>`;
    });

    document.getElementById('res').style.display = "block";
    document.getElementById('ai-output').innerText = "專業資產顧問分析中…";

    // 核心邏輯補修：加入回收價合理性判斷
    const prompt = `
你是專業資產顧問。客戶持有 ${model}，外觀狀況為 ${cond}，
電池健康度 ${battery}%${batteryNote}，目前回收價僅為 ${tradeIn} 元。

【特別判斷】：
如果回收價 ${tradeIn} 遠低於該型號的市場行情（例如 iPhone 16 系列卻低於 1.5 萬，或 iPhone 15 低於 1 萬等），
請「不要」建議回收，請委婉告知目前的回收殘值不符合這台手機應有的資產價值。
建議客戶保留自用或贈與家人，因為「使用才賦予價值」，現在賣掉對他而言是巨大的損失。

如果回收價在合理範圍，請運用以下觀念：
1. 閒置即虧損：米酒瓶概念，空瓶佔空間。
2. 價值活化：現在回收是「止血」。
3. 費用感官：升級 iPhone 17 Pro 每日分攤僅需 $${Math.round((39900 - tradeIn) / 365)}。
4. 備用機迷思：久放必壞，現在處分最聰明。
5. 給家人的迷思：引用 Adam 觀點，給家人舊機不是愛。

請用 180 字內回答，語氣專業誠懇。
結尾根據合適族群說明：iPhone 17(止血族)、17 Pro(效能與平衡)、17 Pro Max(預算寬裕)。
最後加一句中性引導語讓顧客自行對照。
`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + key
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: prompt }]
            })
        });

        const data = await response.json();
        document.getElementById('ai-output').innerText = data.choices[0].message.content;
    } catch {
        document.getElementById('ai-output').innerText = "系統連線異常";
    }
}
</script>

</body>
</html>
