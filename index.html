<script>
// PWA 安裝提示
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault();
deferredPrompt = e;
document.getElementById('installPrompt').classList.add('show');
});

function installApp() {
if (deferredPrompt) {
deferredPrompt.prompt();
deferredPrompt.userChoice.then((choiceResult) => {
if (choiceResult.outcome === 'accepted') {
document.getElementById('installPrompt').classList.remove('show');
}
deferredPrompt = null;
});
}
}

// Service Worker 註冊
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
const swCode = `
self.addEventListener('install', (e) => {
self.skipWaiting();
});

self.addEventListener('activate', (e) => {
self.clients.claim();
});

self.addEventListener('fetch', (e) => {
e.respondWith(fetch(e.request));
});
`;
const blob = new Blob([swCode], { type: 'application/javascript' });
const swUrl = URL.createObjectURL(blob);
navigator.serviceWorker.register(swUrl);
});
}

function getModelAge(model){
if(model.includes("16")) return 1;
if(model.includes("15")) return 2;
if(model.includes("14")) return 3;
if(model.includes("13")) return 4;
if(model.includes("12")) return 5;
if(model.includes("11")) return 6;
return 7;
}

function getConditionText(val){
const conditions = {
"4":"外觀完好",
"3":"輕微使用痕跡",
"2":"明顯刮傷或撞傷",
"1":"螢幕或背蓋損壞"
};
return conditions[val] || "未知";
}

async function getAIRecommendation(data){
if(data.isAbnormallyLow){
return `⚠️ 回收價異常警示

您的 ${data.model} 回收價 NT$${data.tradein.toLocaleString()} 明顯低於市場行情，與同機齡同機型的一般價格相比極不合理。

這個異常價格可能代表：
1. 設備有嚴重損壞（螢幕破裂、機身變形、泡水等）
2. 回收商報價異常偏低
3. 輸入錯誤

建議方案：
• 如果設備嚴重損壞：考慮先送修再回收，或直接使用到完全無法使用
• 如果只是輕微損壞：強烈建議尋求其他回收管道重新報價
• 如果報價錯誤：請重新確認實際回收價格

在如此低的回收價下，回收等於白白損失大量價值，強烈不建議立即回收。${data.userNote ? `\n\n關於您提到的「${data.userNote}」需求，建議先解決回收價過低的問題。` : ''}`;
}

const gap = 44900 - data.tradein;
const daily = Math.round(gap / 365);

let advice = '';
if(data.age >= 5){
advice = `您的 ${data.model} 已使用 ${data.age} 年，屬於該回收的時機。回收價 NT$${data.tradein.toLocaleString()} 可能是最後能折抵的價值。升級到 iPhone 17 Pro Max 補差額 NT$${gap.toLocaleString()}，每天約 NT$${daily}。`;
}else if(data.age >= 4){
advice = `您的 ${data.model} 是公認的「最值一換」機型。回收價 NT$${data.tradein.toLocaleString()} 還算不錯。升級到 iPhone 17 Pro Max 補差額 NT$${gap.toLocaleString()}，每天約 NT$${daily}，就能體驗全面升級。`;
}else if(data.age >= 3){
advice = `您的 ${data.model} 已進入世代交替期，回收價 NT$${data.tradein.toLocaleString()}。繼續持有價值會持續下降。升級到 iPhone 17 Pro Max 補差額 NT$${gap.toLocaleString()}，每天約 NT$${daily}。`;
}else if(data.age >= 2){
advice = `您的 ${data.model} 已是兩代前機型，回收價 NT$${data.tradein.toLocaleString()} 處於合理窗口。升級到 iPhone 17 Pro Max 補差額 NT$${gap.toLocaleString()}，每天約 NT$${daily}。`;
}else{
advice = `您的 ${data.model} 機齡較新，回收價 NT$${data.tradein.toLocaleString()}。如果想體驗最新功能，升級到 iPhone 17 Pro Max 補差額 NT$${gap.toLocaleString()}，每天約 NT$${daily}。`;
}

if(data.userNote){
advice += `\n\n考量您提到的「${data.userNote}」需求，新機在這方面會有明顯提升。`;
}

return advice;
}

async function analyze(){
const model = document.getElementById("model").value;
const battery = parseInt(document.getElementById("battery").value);
const tradein = parseInt(document.getElementById("tradein").value);
const conditionVal = parseInt(document.getElementById("condition").value);
const userNote = document.getElementById("userNote").value.trim();
  
if(!tradein || tradein<1000){
alert("請輸入有效的回收價格");
return;
}

const btn = document.getElementById("analyzeBtn");
btn.disabled = true;
btn.innerHTML = '<span class="loading-spinner"></span>AI 分析中...';

document.getElementById("res").style.display = "block";
document.getElementById("res").scrollIntoView({behavior:"smooth", block:"start"});

const age = getModelAge(model);
const isAbnormallyLow = (age <= 2 && tradein < 10000) || (age <= 1 && tradein < 15000);

let batteryScore = 0;
if(battery<75) batteryScore=100;
else if(battery<80) batteryScore=80;
else if(battery<85) batteryScore=60;
else if(battery<90) batteryScore=40;
else batteryScore=20;

let condScore = 0;
if(conditionVal==1) condScore=100;
else if(conditionVal==2) condScore=70;
else if(conditionVal==3) condScore=45;
else condScore=30;

let totalScore = 0;

if(age <= 2 && tradein >= 20000){
totalScore = 85;
}
else if(age <= 2 && tradein >= 10000){
totalScore = 60;
}
else if(age >= 3 && age <= 4 && tradein >= 12000){
totalScore = 75;
}
else if(age >= 3 && age <= 4){
totalScore = 65;
}
else if(age >= 5){
totalScore = 90;
}
else{
totalScore = 45;
}

const adjustment = Math.round((batteryScore - 60) * 0.1 + (condScore - 30) * 0.1);
totalScore = Math.min(100, Math.max(20, totalScore + adjustment));

let ageScore = 0;
if(age>=6) ageScore=100;
else if(age>=5) ageScore=90;
else if(age>=4) ageScore=75;
else if(age>=3) ageScore=60;
else if(age>=2) ageScore=45;
else ageScore=25;

let valueScore = 0;
if(tradein>=25000) valueScore=90;
else if(tradein>=20000) valueScore=75;
else if(tradein>=15000) valueScore=55;
else if(tradein>=10000) valueScore=40;
else if(tradein>=7000) valueScore=60;
else valueScore=85;

if(isAbnormallyLow) {
totalScore = 25;
ageScore = 25;
valueScore = 20;
batteryScore = 20;
condScore = 30;
}

document.getElementById("scoreNum").textContent = totalScore;
document.getElementById("ageScore").textContent = ageScore;
document.getElementById("condScore").textContent = condScore;
document.getElementById("valueScore").textContent = valueScore;

const badge = document.getElementById("recBadge");
if(isAbnormallyLow){
