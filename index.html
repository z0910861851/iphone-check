<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產診斷 (V14)</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; }
        .card { background: var(--bg-card); padding: 24px; border-radius: 22px; border: 1px solid #333; margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: var(--text-gray); margin-bottom: 8px; font-weight: 500; }
        select, input { width: 100%; padding: 16px; background: #2c2c2e; border: 1px solid #444; border-radius: 14px; color: #fff; font-size: 17px; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        #go { width: 100%; padding: 18px; background: var(--apple-blue); color: #fff; border: none; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; }
        
        /* 診斷報告區塊 */
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 24px; padding: 28px; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .report-header { border-bottom: 1.5px solid #eee; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .report-title { font-weight: 800; font-size: 20px; color: #1c1c1e; }
        #ai-output { font-size: 16px; line-height: 1.8; color: #333; text-align: justify; }
        .quote { font-style: italic; color: var(--apple-blue); font-weight: 600; margin-top: 15px; display: block; text-align: center; }
        
        .admin-area { margin-top: 60px; opacity: 0.1; }
        #apiKey { background: transparent; border: none; color: #555; text-align: center; width: 100%; font-size: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; font-weight:600;">iPhone 價值轉化系統</h2>
    <div class="card">
        <label>鑑定型號</label>
        <select id="m">
            <option>iPhone 16 Pro Max</option>
            <option>iPhone 16 Pro</option>
            <option>iPhone 15 Pro Max</option>
            <option>iPhone 14 Pro Max</option>
            <option>其他 iPhone 系列</option>
        </select>
        <label>電池健康度 %</label>
        <input type="number" id="ba" value="85">
        <label>當前剩餘資產價值 (NT$)</label>
        <input type="number" id="pr" placeholder="輸入鑑定金額">
        <button id="go" onclick="runCheck()">生成智慧診斷建議</button>
    </div>

    <div id="res">
        <div class="report-header">
            <div class="report-title">觀念同步鑑定報告</div>
        </div>
        <div id="ai-output"></div>
        <span class="quote">「退舊不虧，換新最對」</span>
    </div>

    <div class="admin-area"><input type="password" id="apiKey" oninput="saveKey()"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('my_groq_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
});

function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key.startsWith('gsk_')) localStorage.setItem('my_groq_key', key);
}

async function runCheck() {
    const key = document.getElementById('apiKey').value.trim();
    const p = document.getElementById('pr').value;
    const model = document.getElementById('m').value;
    const ba = document.getElementById('ba').value;

    if(!p || !key) return alert("請輸入金額與 Key");

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    output.innerText = "正在同步市場觀念與資產價值分析...";

    // 核心指令：內化簡報邏輯，目標是「觀念同步」
    const prompt = `你是專業的 iPhone 資產顧問。現在要對一位擁有 ${model} (電池 ${ba}%) 的客戶進行「觀念引導」。
    目前的鑑定價值是 ${p} 元。請根據以下「Dragon Team」的簡報觀念來撰寫建議：
    
    1. 賦予價值：用「米酒瓶回收」比喻，這筆 ${p} 元不是賺來的，是本來就鎖在舊手機裡的「抵押金」，現在只是領出來。
    2. 預防風險：用「輪胎安全線」比喻，電池 ${ba}% 代表已經快接近耗損臨界點，等到壞了才換，資料價值與手機殘值都會瞬間歸零。
    3. 階段升級：用「小學課本換新」比喻，舊手機沒壞，但它的功能已經無法銜接現在的 AI 時代。升級不是浪費，是為了跟上生活的進度。
    4. 換算思考：幫客戶計算，如果換新機，分攤下來每天只要幾十元（不到一杯飲料錢），卻能換來全新的效率與安全感。
    
    請用溫暖、堅定、且能引發顧客深思的繁體中文回答。不要像在賣東西，要像在幫他做「人生升級」的規劃。約 180 字。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: prompt }]
            })
        });
        const data = await response.json();
        output.innerText = data.choices[0].message.content;
    } catch (e) {
        output.innerText = "系統繁忙，請稍後重試。";
    }
}
</script>
</body>
</html>
