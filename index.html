<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 行情即時鑑定系統 (V10)</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 18px; border: 1px solid #333; }
        label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600; }
        select, input { width: 100%; padding: 14px; background: #2c2c2e; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        #go { width: 100%; padding: 18px; background: var(--apple-blue); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 20px; padding: 25px; }
        .analysis-box { background: #f2f2f7; padding: 15px; border-radius: 12px; margin-top: 10px; border-left: 5px solid var(--apple-blue); }
        .disclaimer { font-size: 10px; color: #86868b; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center;">iPhone 價值動態鑑定</h2>
    <div class="card">
        <label>設備型號</label>
        <select id="m">
            <option>iPhone 16 Pro Max</option>
            <option>iPhone 16 Pro</option>
            <option>iPhone 15 Pro Max</option>
            <option>iPhone 14 Pro Max</option>
        </select>
        <label>電池健康度 %</label>
        <input type="number" id="ba" value="85">
        <label>回收出價 (NT$)</label>
        <input type="number" id="pr" placeholder="輸入預計回收價">
        <button id="go" onclick="runCheck()">分析行情合理性</button>
    </div>

    <div id="res">
        <div class="analysis-box">
            <b style="color:var(--apple-blue);">🤖 AI 市場動態報告：</b>
            <div id="ai-output" style="margin-top:10px; font-size:14px; line-height:1.6;"></div>
        </div>
        <p class="disclaimer">※ AI 數據具備波動性，報價僅供門市人員參考</p>
    </div>

    <div style="margin-top:50px; text-align:center;">
        <input type="password" id="apiKey" placeholder="在此貼上 Groq Key" oninput="saveKey()" style="font-size:10px; width:70%;">
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('my_groq_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
});

function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key.startsWith('gsk_')) localStorage.setItem('my_groq_key', key);
}

async function runCheck() {
    const key = document.getElementById('apiKey').value.trim();
    const p = document.getElementById('pr').value;
    const model = document.getElementById('m').value;
    const ba = document.getElementById('ba').value;

    if(!p || !key) return alert("請輸入金額與 Key");

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    output.innerText = "🔍 正在從 2026 市場資料庫撈取數據...";

    // 關鍵指令：要求 AI 必須先思考目前的市場價，再做對比
    const prompt = `你是專業手機鑑定師。現在日期是2026年。
    請先根據你的資料庫估算 ${model} 目前在台灣二手機市場的大約收購價區間。
    然後判斷用戶提供的回收價 ${p} 元是否划算。
    
    回覆格式請包含：
    1. 市場參考收購區間
    2. 針對此價格 ${p} 元的合理性評價
    3. 專業建議（考量電池健康度 ${ba}%）
    請用繁體中文，120字以內。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: prompt }]
            })
        });
        const data = await response.json();
        output.innerText = data.choices[0].message.content;
    } catch (e) {
        output.innerText = "網路異常，請稍後再試。";
    }
}
</script>
</body>
</html>
