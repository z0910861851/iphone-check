<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產鑑定報告</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; }
        .t { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 25px; letter-spacing: -0.5px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 18px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600; padding-left: 5px; }
        select, input { width: 100%; padding: 14px; background: #2c2c2e; border: none; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        .row { display: flex; gap: 12px; }
        #go { width: 100%; padding: 18px; background: var(--apple-blue); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 20px; padding: 25px; }
        .score-circle { width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--apple-blue); display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .score { font-size: 32px; font-weight: 800; color: var(--apple-blue); }
        .adv-box { background: #f5f5f7; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.6; color: #1d1d1f; margin-bottom: 15px; border-left: 5px solid var(--apple-blue); }
        .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e5e5e5; font-size: 14px; }
        #ai-section { display:none; margin-top:20px; background:#f2f2f7; padding:15px; border-radius:15px; border:1px dashed #0071e3; color:#000; }
    </style>
</head>
<body>

<div class="box">
    <div class="t">iPhone 資產價值精算</div>
    <div class="card">
        <label>設備型號</label>
        <select id="m">
            <optgroup label="iPhone 16 系列">
                <option value="16PM" data-p="44900">iPhone 16 Pro Max</option>
                <option value="16P" data-p="36900">iPhone 16 Pro</option>
                <option value="16" data-p="29900">iPhone 16</option>
            </optgroup>
            <optgroup label="iPhone 15 系列">
                <option value="15PM" data-p="44900">iPhone 15 Pro Max</option>
                <option value="15" data-p="29900">iPhone 15</option>
            </optgroup>
            <option value="14" data-p="27900">iPhone 14 系列</option>
            <option value="11-13" data-p="25900">iPhone 11-13 系列</option>
        </select>
        <div class="row">
            <div style="flex:1"><label>持有年數</label><input type="number" id="yr" value="2"></div>
            <div style="flex:1"><label>電池健康度 %</label><input type="number" id="ba" value="82"></div>
        </div>
        <label>現場鑑定回收價 (NT$)</label>
        <input type="number" id="pr" placeholder="輸入金額">
        <button id="go" onclick="runCheck()">生成診斷報告</button>
    </div>

    <div id="res">
        <div class="score-circle"><div class="score" id="sS">0%</div></div>
        <div class="adv-box" id="sA"></div>
        <div class="item"><span>預計領回</span><b id="sC"></b></div>
        <div class="item"><span>每月成本</span><b id="sM"></b></div>
        
        <div id="ai-section">
            <b style="color:#0071e3;">🤖 AI 市場專家建議：</b>
            <div id="ai-loading" style="display:none; font-size:12px; color:#86868b;">分析中...</div>
            <div id="ai-output" style="margin-top:10px;"></div>
        </div>
    </div>

    <div style="margin-top:50px; opacity:0.3;"><input type="password" id="apiKey" placeholder="在此貼上 API Key" style="font-size:10px;"></div>
</div>

<script>
async function runCheck() {
    var p = parseFloat(document.getElementById('pr').value);
    var yr = parseFloat(document.getElementById('yr').value) || 1;
    var ba = parseInt(document.getElementById('ba').value);
    var sel = document.getElementById('m');
    var modelName = sel.options[sel.selectedIndex].text;
    var orig = parseFloat(sel.options[sel.selectedIndex].getAttribute('data-p'));
    
    document.getElementById('sS').innerText = "95%";
    document.getElementById('sA').innerHTML = "<b>系統診斷完成</b><br>請見下方 AI 市場即時分析。";
    document.getElementById('sC').innerText = "NT$ " + p.toLocaleString();
    document.getElementById('sM').innerText = "NT$ " + Math.floor((orig-p)/(yr*12)).toLocaleString();
    document.getElementById('res').style.display = "block";

    // AI 觸發邏輯
    const key = document.getElementById('apiKey').value;
    if(!key) return;
    const output = document.getElementById('ai-output');
    document.getElementById('ai-section').style.display = "block";
    document.getElementById('ai-loading').style.display = "block";
    
    const prompt = `你是手機鑑定專家。iPhone機型：${modelName}，回收價：NT$${p}。健康度：${ba}%。請以2026年市場角度分析此回收價是否划算，並給出建議。100字內。`;
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        output.innerText = data.candidates[0].content.parts[0].text;
    } catch (e) { output.innerText = "連線失敗"; }
    document.getElementById('ai-loading').style.display = "none";
}
</script>
</body>
</html>
