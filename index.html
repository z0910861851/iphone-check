<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產鑑定 (Groq 極速版)</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; }
        .t { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 25px; letter-spacing: -0.5px; }
        
        /* 表單卡片 */
        .card { background: var(--bg-card); padding: 20px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #333; }
        label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600; padding-left: 5px; }
        select, input { width: 100%; padding: 14px; background: #2c2c2e; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        
        /* 按鈕 - 改為 Groq 的綠色 */
        #go { width: 100%; padding: 18px; background: #34c759; color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
        #go:active { opacity: 0.8; transform: scale(0.98); }

        /* 結果顯示區 */
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 20px; padding: 25px; }
        .score-circle { width: 90px; height: 90px; border-radius: 50%; border: 6px solid #34c759; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .score { font-size: 32px; font-weight: 800; color: #34c759; }
        
        /* AI 建議區塊 */
        #ai-section { margin-top:20px; background:#f2f2f7; padding:18px; border-radius:15px; border-left: 5px solid #34c759; }
        #ai-output { font-size: 15px; line-height: 1.6; color: #1c1c1e; white-space: pre-wrap; }

        /* 金鑰管理區 */
        .admin-area { margin-top: 60px; padding: 20px; border-top: 1px solid #333; text-align: center; }
        #apiKey { background: #1c1c1e; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; width: 90%; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <div class="t">iPhone 資產鑑定 (Groq)</div>

    <div class="card">
        <label>設備型號</label>
        <select id="m">
            <option value="16PM">iPhone 16 Pro Max</option>
            <option value="16P">iPhone 16 Pro</option>
            <option value="15PM">iPhone 15 Pro Max</option>
            <option value="14">iPhone 14 系列</option>
        </select>

        <label>電池健康度 %</label>
        <input type="number" id="ba" value="85">

        <label>現場鑑定回收價 (NT$)</label>
        <input type="number" id="pr" placeholder="輸入金額">
        
        <button id="go" onclick="runCheck()">啟動極速 AI 鑑定</button>
    </div>

    <div id="res">
        <div class="score-circle"><div class="score" id="sS">--</div></div>
        <div style="text-align:center; font-size:12px; color:var(--text-gray); margin-bottom:15px;">AI 建議行情指數</div>
        
        <div id="ai-section">
            <div style="display:flex; align-items:center; margin-bottom:8px;">
                <b style="color:#34c759;">⚡ Groq 極速分析</b>
            </div>
            <div id="ai-output"></div>
        </div>
    </div>

    <div class="admin-area">
        <label>Groq API 金鑰 (自動儲存)</label>
        <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveKey()">
    </div>
</div>

<script>
// 自動讀取儲存的金鑰
window.onload = function() {
    const savedKey = localStorage.getItem('groq_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
}

function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    localStorage.setItem('groq_key', key);
}

async function runCheck() {
    const p = document.getElementById('pr').value;
    const key = document.getElementById('apiKey').value.trim();
    const modelName = document.getElementById('m').options[document.getElementById('m').selectedIndex].text;
    const battery = document.getElementById('ba').value;

    if(!p || !key) { alert("請輸入金額並貼上 Groq Key"); return; }

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    output.innerText = "⚡ 正在連線 Groq 高速晶片分析中...";

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${key}`
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    {role: "system", content: "你是一位專業 iPhone 鑑定師，請用台灣繁體中文提供精確的行情建議。"},
                    {role: "user", content: `機型：${modelName}，回收價：${p}元，電池：${battery}%。請以2026年市場視角，在80字內簡短分析是否划算並給出建議，最後加一個分數如 [分數：90%]。`}
                ]
            })
        });
        
        const data = await response.json();
        
        if (data.error) {
            output.innerHTML = `<span style="color:red;">錯誤：${data.error.message}</span>`;
        } else {
            const aiText = data.choices[0].message.content;
            output.innerText = aiText;
            const scoreMatch = aiText.match(/\d+%/);
            document.getElementById('sS').innerText = scoreMatch ? scoreMatch[0] : "92%";
        }
    } catch (error) {
        output.innerText = "連線失敗，請檢查網路。";
    }
}
</script>
</body>
</html>
