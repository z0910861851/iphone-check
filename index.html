<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產鑑定 (V3)</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; }
        .t { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 25px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #333; }
        label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600; }
        select, input { width: 100%; padding: 14px; background: #2c2c2e; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        #go { width: 100%; padding: 18px; background: var(--apple-blue); color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 20px; padding: 25px; }
        .score-circle { width: 90px; height: 90px; border-radius: 50%; border: 6px solid var(--apple-blue); display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .score { font-size: 32px; font-weight: 800; color: var(--apple-blue); }
        #ai-section { display:none; margin-top:20px; background:#f2f2f7; padding:18px; border-radius:15px; border-left: 5px solid var(--apple-blue); }
        .admin-area { margin-top: 60px; padding: 20px; border-top: 1px solid #333; text-align: center; }
        #apiKey { background: #1c1c1e; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; width: 90%; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <div class="t">iPhone 資產價值診斷 (V3)</div>
    <div class="card">
        <label>設備型號</label>
        <select id="m">
            <option value="16PM" data-p="44900">iPhone 16 Pro Max</option>
            <option value="16P" data-p="36900">iPhone 16 Pro</option>
            <option value="15PM" data-p="44900">iPhone 15 Pro Max</option>
            <option value="14" data-p="27900">iPhone 14 系列</option>
        </select>
        <div style="display:flex; gap:10px;">
            <div style="flex:1"><label>持有年數</label><input type="number" id="yr" value="1"></div>
            <div style="flex:1"><label>電池健康度 %</label><input type="number" id="ba" value="90"></div>
        </div>
        <label>現場鑑定回收價 (NT$)</label>
        <input type="number" id="pr" placeholder="輸入金額">
        <button id="go" onclick="runCheck()">啟動 AI 鑑定</button>
    </div>

    <div id="res">
        <div class="score-circle"><div class="score" id="sS">--</div></div>
        <div id="ai-section">
            <b style="color:#0071e3;">🤖 AI 市場動態分析：</b>
            <div id="ai-output" style="margin-top:10px; font-size:14px;"></div>
        </div>
    </div>

    <div class="admin-area">
        <label>系統引擎設定</label>
        <input type="password" id="apiKey" placeholder="在此貼上 API Key">
    </div>
</div>

<script>
async function runCheck() {
    const key = document.getElementById('apiKey').value.trim();
    const p = document.getElementById('pr').value;
    if(!p) return alert("請輸入金額");

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    document.getElementById('ai-section').style.display = "block";
    output.innerText = "連線中...";

    try {
        // 這是 Google 最標準的 v1 正式版路徑
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: "請簡短分析iPhone回收價是否划算。" }] }] })
        });
        
        const data = await response.json();
        if (data.error) {
            output.innerHTML = `<span style="color:red;">錯誤詳情：${data.error.message}</span>`;
        } else {
            output.innerText = data.candidates[0].content.parts[0].text;
            document.getElementById('sS').innerText = "90%";
        }
    } catch (error) {
        output.innerText = "網路異常，請確認 API Key。";
    }
}
</script>
</body>
</html>
