<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舊換新回收建議</title>

<style>
:root{
--apple-blue:#0071e3;
--bg:#f5f5f7;
--card:#fff;
--text:#1d1d1f;
}

body{
margin:0;
padding:20px;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
display:flex;
justify-content:center;
color:var(--text);
}

.box{width:100%;max-width:440px;}

.card{
background:var(--card);
border-radius:24px;
padding:25px;
box-shadow:0 8px 30px rgba(0,0,0,.05);
border:1px solid #e5e5e7;
margin-bottom:20px;
}

h2{text-align:center;margin-bottom:25px;}

label{
display:block;
font-size:13px;
color:#86868b;
margin-bottom:6px;
}

select,input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #d2d2d7;
margin-bottom:18px;
font-size:16px;
background:#fafafa;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:16px;
background:var(--apple-blue);
color:#fff;
font-size:18px;
font-weight:600;
cursor:pointer;
}

#res{display:none;}

.analysis{
display:grid;
gap:14px;
margin-top:20px;
}

.analysis-card{
background:#fafafa;
border:1px solid #e5e5e7;
border-radius:18px;
padding:16px 18px;
}

.analysis-card h3{
margin:0 0 8px;
font-size:15px;
}

.analysis-card ul{
margin:0;
padding-left:18px;
font-size:13px;
line-height:1.7;
color:#3a3a3c;
}

.finance-table{
width:100%;
border-collapse:collapse;
font-size:12px;
margin-top:20px;
}

.finance-table th{
background:#fbfbfd;
padding:10px;
color:#86868b;
border-bottom:1px solid #eee;
}

.finance-table td{
padding:12px;
text-align:center;
border-bottom:1px solid #f2f2f2;
}

.model-name{text-align:left;font-weight:600;}
.price-tag{color:#d70015;font-weight:600;}
.daily-blue{color:#0071e3;font-weight:700;}
</style>
</head>

<body>
<div class="box">

<h2>舊換新回收建議</h2>

<div class="card">
<label>舊機型號</label>
<select id="model">
<option>iPhone 16 Pro Max</option>
<option>iPhone 16 Pro</option>
<option>iPhone 16 Plus</option>
<option>iPhone 16</option>

<option>iPhone 15 Pro Max</option>
<option>iPhone 15 Pro</option>
<option>iPhone 15 Plus</option>
<option>iPhone 15</option>

<option>iPhone 14 Pro Max</option>
<option>iPhone 14 Pro</option>
<option>iPhone 14 Plus</option>
<option>iPhone 14</option>

<option>iPhone 13 Pro Max</option>
<option>iPhone 13 Pro</option>
<option>iPhone 13</option>
<option>iPhone 13 mini</option>

<option>iPhone 12 Pro Max</option>
<option>iPhone 12 Pro</option>
<option>iPhone 12</option>
<option>iPhone 12 mini</option>

<option>iPhone 11 Pro Max</option>
<option>iPhone 11 Pro</option>
<option>iPhone 11</option>
</select>

<label>電池健康度 (%)</label>
<input type="number" id="battery" value="85">

<label>舊機回收價 (NT$)</label>
<input type="number" id="tradein">

<button onclick="analyze()">開始分析</button>
</div>

<div id="res" class="card">

<div class="analysis">

<div class="analysis-card">
<h3>🔋 電池狀態</h3>
<ul id="batteryText"></ul>
</div>

<div class="analysis-card">
<h3>📆 使用世代評估</h3>
<ul id="generationText"></ul>
</div>

<div class="analysis-card">
<h3>💰 回收價值判斷</h3>
<ul id="priceText"></ul>
</div>

</div>

<table class="finance-table">
<thead>
<tr>
<th style="text-align:left">新機型號</th>
<th>售價</th>
<th>補差額</th>
<th>每日換機</th>
</tr>
</thead>
<tbody id="financeBody"></tbody>
</table>

</div>

</div>

<script>
function analyze(){
const model=document.getElementById("model").value;
const battery=parseInt(document.getElementById("battery").value);
const tradein=parseInt(document.getElementById("tradein").value);
if(!tradein){alert("請輸入回收價");return;}

document.getElementById("res").style.display="block";

/* 電池 */
const b=document.getElementById("batteryText");
b.innerHTML="";
if(battery>=90){
b.innerHTML+=`<li>電池狀況仍佳，日常使用穩定</li>`;
b.innerHTML+=`<li>換機主要著眼於整體體驗升級</li>`;
}else if(battery>=80){
b.innerHTML+=`<li>電池已有自然耗損</li>`;
b.innerHTML+=`<li>續航表現在高使用情境下略受影響</li>`;
}else{
b.innerHTML+=`<li>電池衰退明顯</li>`;
b.innerHTML+=`<li>續航已成為影響體驗的關鍵因素</li>`;
}

/* 世代 */
const g=document.getElementById("generationText");
g.innerHTML="";
if(model.includes("16") || model.includes("15")){
g.innerHTML+=`<li>屬於近代機型</li>`;
g.innerHTML+=`<li>升級著重在功能完整度與未來支援年限</li>`;
}else if(model.includes("14") || model.includes("13")){
g.innerHTML+=`<li>已進入世代交替區間</li>`;
g.innerHTML+=`<li>升級可明顯改善效能與拍攝體驗</li>`;
}else{
g.innerHTML+=`<li>與現行世代差距明顯</li>`;
g.innerHTML+=`<li>新機在流暢度與穩定性提升顯著</li>`;
}

/* 價值 */
const p=document.getElementById("priceText");
p.innerHTML="";
if(tradein>=20000){
p.innerHTML+=`<li>回收價仍具相當轉換價值</li>`;
p.innerHTML+=`<li>適合直接轉為新機使用效益</li>`;
}else if(tradein>=12000){
p.innerHTML+=`<li>回收價落在主流區間</li>`;
p.innerHTML+=`<li>升級可著重在實際使用改善幅度</li>`;
}else{
p.innerHTML+=`<li>回收價已接近殘值區</li>`;
p.innerHTML+=`<li>換機能明確改善整體體驗</li>`;
}

/* 新機 */
const models=[
{name:"iPhone 17",price:29900},
{name:"iPhone 17 Pro",price:39900},
{name:"iPhone 17 Pro Max",price:44900}
];

const tbody=document.getElementById("financeBody");
tbody.innerHTML="";
models.forEach(m=>{
const gap=m.price-tradein;
tbody.innerHTML+=`
<tr>
<td class="model-name">${m.name}</td>
<td>$${m.price.toLocaleString()}</td>
<td class="price-tag">$${gap.toLocaleString()}</td>
<td class="daily-blue">$${Math.round(gap/365)}</td>
</tr>`;
});
}
</script>

</body>
</html>
