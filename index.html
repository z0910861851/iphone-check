<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 資產價值智慧診斷</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 400px; }
        .t { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 25px; color: #fff; }
        .card { background: var(--bg-card); padding: 24px; border-radius: 22px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        label { display: block; font-size: 13px; color: var(--text-gray); margin-bottom: 10px; font-weight: 500; }
        select, input { width: 100%; padding: 16px; background: #2c2c2e; border: 1px solid #444; border-radius: 14px; color: #fff; font-size: 17px; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--apple-blue); }
        #go { width: 100%; padding: 18px; background: var(--apple-blue); color: #fff; border: none; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; }
        
        /* 結果區塊 - 走溫馨高品質路線 */
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 24px; padding: 30px; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .ai-title { color: var(--apple-blue); font-weight: 700; font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; }
        #ai-output { font-size: 16px; line-height: 1.7; color: #333; }
        .admin-area { margin-top: 50px; opacity: 0.3; text-align: center; }
        #apiKey { background: transparent; border: none; color: #555; text-align: center; font-size: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="box">
    <div class="t">iPhone 官方鑑定報告</div>
    
    <div class="card">
        <label>鑑定機型</label>
        <select id="m">
            <option>iPhone 16 Pro Max</option>
            <option>iPhone 16 Pro</option>
            <option>iPhone 15 Pro Max</option>
            <option>iPhone 14 Pro Max</option>
        </select>

        <label>電池健康度</label>
        <input type="number" id="ba" value="88">

        <label>本機當前剩餘資產價值 (NT$)</label>
        <input type="number" id="pr" placeholder="請填寫鑑定金額">
        
        <button id="go" onclick="runCheck()">生成專業鑑定建議</button>
    </div>

    <div id="res">
        <div class="ai-title">✨ AI 資產規劃建議</div>
        <div id="ai-output"></div>
        <div style="margin-top: 20px; border-top: 1px solid #eee; pt: 15px; font-size: 12px; color: #999; text-align: center;">
            數據由 AI 智慧運算處理，結果僅供參考。
        </div>
    </div>

    <div class="admin-area">
        <input type="password" id="apiKey" placeholder="Key 記憶中..." oninput="saveKey()">
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('my_groq_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
});

function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key.startsWith('gsk_')) localStorage.setItem('my_groq_key', key);
}

async function runCheck() {
    const key = document.getElementById('apiKey').value.trim();
    const p = document.getElementById('pr').value;
    const model = document.getElementById('m').value;
    const ba = document.getElementById('ba').value;

    if(!p || !key) return alert("請填寫金額與系統金鑰");

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    output.innerText = "AI 正在進行資產折舊率分析與共情建議...";

    // 關鍵指令：不詢價，而是做「資產建議」
    const prompt = `你是專業的手機資產顧問。現在顧客有一台 ${model}，電池 ${ba}%，店內鑑定金額為 ${p} 元。
    你的任務不是質疑價格，而是站在顧客的角度，用「共情」和「資產保護」的口吻分析：
    1. 肯定這台手機過去的價值。
    2. 說明現在變現的好處（例如：避免未來電池老化導致價格崩盤、趁現在還有高殘值換新機）。
    3. 讓顧客覺得「現在回收是聰明的理財決定」而非被店員賺錢。
    請用溫暖、專業、誠懇的繁體中文回答，約120字。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: prompt }]
            })
        });
        const data = await response.json();
        output.innerText = data.choices[0].message.content;
    } catch (e) {
        output.innerText = "系統繁忙中，請稍後重試。";
    }
}
</script>
</body>
</html>
