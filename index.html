<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產鑑定 (自動記憶版)</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; }
        .t { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 25px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #333; }
        label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 14px; background: #2c2c2e; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        #go { width: 100%; padding: 18px; background: #34c759; color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 20px; padding: 25px; }
        #ai-section { margin-top:10px; background:#f2f2f7; padding:15px; border-radius:12px; border-left: 5px solid #34c759; }
        .admin-area { margin-top: 60px; padding: 20px; border-top: 1px solid #333; text-align: center; }
        #apiKey { background: #1c1c1e; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; width: 90%; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <div class="t">iPhone 資產鑑定 (V6)</div>
    <div class="card">
        <label>回收金額 (NT$)</label>
        <input type="number" id="pr" placeholder="請輸入金額">
        <button id="go" onclick="runCheck()">啟動極速 AI 分析</button>
    </div>

    <div id="res">
        <div id="ai-section">
            <b style="color:#34c759;">⚡ Groq 行情分析：</b>
            <div id="ai-output" style="margin-top:10px; font-size:14px;"></div>
        </div>
    </div>

    <div class="admin-area">
        <label>Groq API 金鑰 (填入一次，永久記憶)</label>
        <input type="password" id="apiKey" placeholder="gsk_..." oninput="saveKey()">
        <p id="saveMsg" style="font-size:10px; color:#34c759; margin-top:5px; display:none;">✅ 已安全儲存於此裝置</p>
    </div>
</div>

<script>
// 1. 網頁開啟時，自動填入金鑰
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('groq_api_key');
    if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        document.getElementById('saveMsg').style.display = 'block';
    }
});

// 2. 當你輸入或貼上時，即時儲存
function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key.startsWith('gsk_')) {
        localStorage.setItem('groq_api_key', key);
        document.getElementById('saveMsg').style.display = 'block';
    }
}

async function runCheck() {
    const key = document.getElementById('apiKey').value.trim();
    const p = document.getElementById('pr').value;
    if(!p || !key) return alert("請輸入金額並確認金鑰已填寫");

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    output.innerText = "極速分析中...";

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${key}`
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{role: "user", content: `你是 iPhone 鑑定師，分析回收價 NT$${p} 是否划算，請用繁體中文在 80 字內回答。`}]
            })
        });
        
        const data = await response.json();
        output.innerText = data.choices[0].message.content;
    } catch (error) {
        output.innerText = "連線失敗，請檢查網路或金鑰。";
    }
}
</script>
</body>
</html>
