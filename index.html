<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舊換新回收建議</title>

<style>
:root {
    --apple-blue:#0071e3;
    --bg-main:#f5f5f7;
    --card-white:#ffffff;
    --text-dark:#1d1d1f;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg-main);
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    color:var(--text-dark);
}

.box{width:100%;max-width:440px;}

.card{
    background:var(--card-white);
    padding:25px;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
    border:1px solid #e5e5e7;
    margin-bottom:20px;
}

h2{text-align:center;font-weight:600;margin-bottom:25px;}

label{
    display:block;
    font-size:13px;
    color:#86868b;
    margin-bottom:8px;
    padding-left:4px;
}

select,input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #d2d2d7;
    background:#fafafa;
    font-size:16px;
    margin-bottom:18px;
}

select:focus,input:focus{
    outline:none;
    border-color:var(--apple-blue);
}

#go{
    width:100%;
    padding:18px;
    border:none;
    border-radius:16px;
    background:var(--apple-blue);
    color:#fff;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

#res{
    display:none;
    background:#fff;
    border-radius:24px;
    padding:25px;
    border:1px solid #e5e5e7;
    animation:slideUp .4s ease-out;
}

@keyframes slideUp{
    from{opacity:0;transform:translateY(15px);}
    to{opacity:1;transform:translateY(0);}
}

.finance-table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
    margin-bottom:16px;
}

.finance-table th{
    background:#fbfbfd;
    padding:12px 5px;
    color:#86868b;
    border-bottom:1px solid #eee;
}

.finance-table td{
    padding:14px 5px;
    text-align:center;
    border-bottom:1px solid #f5f5f7;
}

.model-name{
    text-align:left!important;
    padding-left:10px!important;
    font-weight:700;
}

.price-tag{color:#d70015;font-weight:600;}
.daily-blue{color:var(--apple-blue);font-weight:800;font-size:15px;}

.usage-cards{
    display:grid;
    gap:14px;
    margin:18px 0;
}

.usage-card{
    background:#fafafa;
    border:1px solid #e5e5e7;
    border-radius:18px;
    padding:16px 18px;
}

.usage-card h3{
    margin:0 0 10px;
    font-size:15px;
    font-weight:600;
}

.usage-card ul{
    margin:0;
    padding-left:18px;
    font-size:13px;
    line-height:1.7;
    color:#3a3a3c;
}

.usage-note{
    text-align:center;
    font-size:12px;
    color:#6e6e73;
    margin-bottom:14px;
}

#ai-output{
    font-size:15px;
    line-height:1.8;
    border-top:1px solid #f2f2f2;
    padding-top:20px;
    color:#3a3a3c;
}

.quote{
    display:block;
    margin-top:16px;
    text-align:center;
    font-size:13px;
    font-style:italic;
    color:var(--apple-blue);
}

.admin-section{
    margin-top:40px;
    padding-top:15px;
    border-top:2px dashed #d2d2d7;
}

#apiKey{font-size:10px;}
</style>
</head>

<body>
<div class="box">

<h2>舊換新回收建議（內部使用）</h2>

<div class="card">
<label>鑑定舊機型號</label>
<select id="m">
<option>iPhone 16 Pro Max</option>
<option>iPhone 16 Pro</option>
<option>iPhone 16 Plus</option>
<option>iPhone 16</option>
<option>iPhone 15 Pro Max</option>
<option>iPhone 15 Pro</option>
<option>iPhone 15 Plus</option>
<option>iPhone 15</option>
<option>iPhone 14 Pro Max</option>
<option>iPhone 14 Pro</option>
<option>iPhone 14 Plus</option>
<option>iPhone 14</option>
<option>iPhone 13 Pro Max</option>
<option>iPhone 13 Pro</option>
<option>iPhone 13</option>
<option>iPhone 13 mini</option>
<option>iPhone 12 Pro Max</option>
<option>iPhone 12 Pro</option>
<option>iPhone 12</option>
<option>iPhone 12 mini</option>
<option>iPhone 11 Pro Max</option>
<option>iPhone 11 Pro</option>
<option>iPhone 11</option>
</select>

<label>外觀狀態</label>
<select id="cond">
<option>外觀完美</option>
<option>輕微使用痕跡</option>
<option>明顯傷痕</option>
<option>螢幕或背蓋損壞</option>
</select>

<div style="display:flex;gap:12px;">
<div style="flex:1">
<label>電池健康度 %</label>
<input type="number" id="ba" value="85">
</div>
<div style="flex:1">
<label>舊機回收價 (NT$)</label>
<input type="number" id="pr">
</div>
</div>

<button id="go" onclick="runCheck()">開始分析</button>
</div>

<div id="res">
<table class="finance-table">
<thead>
<tr>
<th style="text-align:left;padding-left:10px;">目標新機</th>
<th>參考價</th>
<th>需補差價</th>
<th>每月 / 每日</th>
</tr>
</thead>
<tbody id="financeBody"></tbody>
</table>

<div class="usage-cards">
<div class="usage-card">
<h3>📱 iPhone 17</h3>
<ul>
<li>日常通訊、社群、影音與一般 App 使用</li>
<li>使用習慣單純，需求明確</li>
<li>重點在改善目前使用體驗</li>
</ul>
</div>

<div class="usage-card">
<h3>📱 iPhone 17 Pro</h3>
<ul>
<li>手機使用頻率高，包含工作與多工</li>
<li>在意效能與未來幾年的穩定度</li>
<li>希望一支手機應付多數情境</li>
</ul>
</div>

<div class="usage-card">
<h3>📱 iPhone 17 Pro Max</h3>
<ul>
<li>長時間觀看內容或拍攝創作</li>
<li>對螢幕尺寸與續航有明確需求</li>
<li>希望拉長整體使用週期</li>
</ul>
</div>
</div>

<div class="usage-note">
可依照自己平常的使用方式，對照哪一種情境最接近目前需求。
</div>

<div id="ai-output"></div>
<span class="quote">「使用，才真正賦予價值」</span>
</div>

<div class="admin-section">
<label>系統設定（僅需一次）</label>
<input type="password" id="apiKey" placeholder="gsk_ 開頭金鑰" oninput="saveKey()">
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
const k=localStorage.getItem("my_groq_key");
if(k){document.getElementById("apiKey").value=k;document.querySelector(".admin-section").style.display="none";}
});

function saveKey(){
const k=document.getElementById("apiKey").value.trim();
if(k.startsWith("gsk_")){localStorage.setItem("my_groq_key",k);document.querySelector(".admin-section").style.display="none";}
}

function runCheck(){
const tradeIn=parseFloat(document.getElementById("pr").value);
if(!tradeIn){alert("請輸入回收價");return;}

const models=[
{name:"iPhone 17",price:29900},
{name:"iPhone 17 Pro",price:39900},
{name:"iPhone 17 Pro Max",price:44900}
];

const tbody=document.getElementById("financeBody");
tbody.innerHTML="";
models.forEach(m=>{
const gap=m.price-tradeIn;
tbody.innerHTML+=`
<tr>
<td class="model-name">${m.name}</td>
<td>$${m.price.toLocaleString()}</td>
<td class="price-tag">$${gap.toLocaleString()}</td>
<td>$${Math.round(gap/12)} / <span class="daily-blue">$${Math.round(gap/365)}</span></td>
</tr>`;
});

document.getElementById("res").style.display="block";
document.getElementById("ai-output").innerText="（此區可選擇性啟用 AI 補充說明）";
}
</script>

</body>
</html>
