<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產診斷 (V26)</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-card: #1c1c1e; --text-gray: #86868b; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 440px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 6px; font-weight: 500; }
        select, input { width: 100%; padding: 14px; background: #2c2c2e; border: 1px solid #444; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        #go { width: 100%; padding: 18px; background: var(--apple-blue); color: #fff; border: none; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; }
        #res { display: none; margin-top: 25px; background: #fff; color: #000; border-radius: 24px; padding: 20px; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .finance-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
        .finance-table th { background: #f2f2f7; padding: 10px 5px; color: #666; font-weight: 500; border-bottom: 1px solid #ddd; }
        .finance-table td { padding: 12px 5px; text-align: center; border-bottom: 1px solid #eee; }
        .model-name { font-weight: 700; color: #1c1c1e; text-align: left !important; padding-left: 10px !important; }
        .price-tag { color: #e30000; font-weight: 600; }
        .daily-blue { color: var(--apple-blue); font-weight: 800; font-size: 15px; }
        
        #ai-output { font-size: 14px; line-height: 1.7; color: #333; text-align: justify; border-top: 1px solid #eee; padding-top: 15px; }
        .quote { font-style: italic; color: var(--apple-blue); font-weight: 600; margin-top: 15px; display: block; text-align: center; font-size: 12px; }
        .admin-area { margin-top: 40px; opacity: 0.02; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align:center; font-weight:600;">iPhone 17 價值活化報告</h2>
    <div class="card">
        <label>鑑定舊機型號 (全系列)</label>
        <select id="m">
            <optgroup label="iPhone 16 系列">
                <option>iPhone 16 Pro Max</option><option>iPhone 16 Pro</option><option>iPhone 16 Plus</option><option>iPhone 16</option>
            </optgroup>
            <optgroup label="iPhone 15 系列">
                <option>iPhone 15 Pro Max</option><option>iPhone 15 Pro</option><option>iPhone 15 Plus</option><option>iPhone 15</option>
            </optgroup>
            <optgroup label="iPhone 14 系列">
                <option>iPhone 14 Pro Max</option><option>iPhone 14 Pro</option><option>iPhone 14 Plus</option><option>iPhone 14</option>
            </optgroup>
            <optgroup label="iPhone 13 系列">
                <option>iPhone 13 Pro Max</option><option>iPhone 13 Pro</option><option>iPhone 13</option><option>iPhone 13 mini</option>
            </optgroup>
            <optgroup label="iPhone 12 系列">
                <option>iPhone 12 Pro Max</option><option>iPhone 12 Pro</option><option>iPhone 12</option><option>iPhone 12 mini</option>
            </optgroup>
            <optgroup label="iPhone 11 系列">
                <option>iPhone 11 Pro Max</option><option>iPhone 11 Pro</option><option>iPhone 11</option>
            </optgroup>
        </select>

        <label>外觀與螢幕狀態</label>
        <select id="cond">
            <option value="完美">外觀完美 / 無摔無傷</option>
            <option value="輕微使用痕跡">輕微使用痕跡</option>
            <option value="明顯傷痕">明顯傷痕 / 邊框掉漆</option>
            <option value="螢幕或背蓋損壞">螢幕或背蓋損壞 (需維修)</option>
        </select>

        <div style="display:flex; gap:12px;">
            <div style="flex:1"><label>電池健康度 %</label><input type="number" id="ba" value="85"></div>
            <div style="flex:1"><label>舊機回收價 (NT$)</label><input type="number" id="pr" placeholder="輸入報價"></div>
        </div>
        
        <button id="go" onclick="runCheck()">開始精算升級成本</button>
    </div>

    <div id="res">
        <table class="finance-table">
            <thead>
                <tr>
                    <th style="text-align:left; padding-left:10px;">目標新機(256G)</th>
                    <th>新機原價</th>
                    <th>需補差價</th>
                    <th>每月 / 每日</th>
                </tr>
            </thead>
            <tbody id="financeBody"></tbody>
        </table>
        <div id="ai-output"></div>
        <span class="quote">「退舊不虧，換新最對」</span>
    </div>

    <div class="admin-area"><input type="password" id="apiKey" oninput="saveKey()" style="font-size: 8px;"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('my_groq_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
});

function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key.startsWith('gsk_')) localStorage.setItem('my_groq_key', key);
}

async function runCheck() {
    const key = document.getElementById('apiKey').value.trim();
    const tradeIn = parseFloat(document.getElementById('pr').value);
    
    // 固定目標售價 iPhone 17 (256G)
    const models = [
        { name: "iPhone 17", price: 33400 },
        { name: "iPhone 17 Pro", price: 40400 },
        { name: "iPhone 17 PM", price: 48400 }
    ];

    if(!tradeIn || !key) return alert("請輸入報價與 API 金鑰");

    const tbody = document.getElementById('financeBody');
    tbody.innerHTML = "";
    let proDaily = 0;

    models.forEach(m => {
        const gap = m.price - tradeIn;
        const monthly = Math.round(gap / 12);
        const daily = Math.round(gap / 365);
        if(m.name === "iPhone 17 Pro") proDaily = daily;
        
        tbody.innerHTML += `
            <tr>
                <td class="model-name">${m.name}</td>
                <td>$${m.price.toLocaleString()}</td>
                <td class="price-tag">$${gap.toLocaleString()}</td>
                <td>$${monthly.toLocaleString()} / <span class="daily-blue">$${daily}</span></td>
            </tr>
        `;
    });

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    output.innerText = "AI 顧問正在同步觀念...";

    const prompt = `你是專業資產顧問。客戶持有 ${document.getElementById('m').value} 回收價 ${tradeIn}元。
    請務必運用以下五大觀念進行引導：
    1. 閒置即虧損：舊手機沒人使用就無法賦於價值，就像「米酒瓶」只留著空瓶不拿去換新米酒，就只是佔空間。
    2. 價值活化：強調現在回收是「止血」，將舊資產轉化為 iPhone 17 的升級資金。
    3. 費用感官：升級 iPhone 17 Pro 每天僅需 $${proDaily}，就像一杯飲料錢換來全新保固與 AI 生產力。
    4. 備用機迷思：舊機久放必壞（電池膨脹、螢幕老化），現在處分才是最聰明的決定。
    5. 給家人的迷思：引用 Adam 觀點，給家人一台變慢、電池不好的舊機不是愛，而是給他們麻煩。
    請以誠懇、專業且溫暖的繁體中文回答，約 180 字。強調「使用才賦予價值」。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: prompt }] })
        });
        const data = await response.json();
        output.innerText = data.choices[0].message.content;
    } catch (e) { output.innerText = "系統繁忙中，請確認 API Key 後重試。"; }
}
</script>
</body>
</html>
