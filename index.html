<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 專業資產診斷 (V30)</title>
    <style>
        :root { --apple-blue: #0071e3; --bg-main: #f5f5f7; --card-white: #ffffff; --text-dark: #1d1d1f; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-main); color: var(--text-dark); padding: 20px; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 440px; }
        .card { background: var(--card-white); padding: 25px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e5e5e7; }
        h2 { text-align: center; font-weight: 600; margin-bottom: 25px; color: #333; }
        label { display: block; font-size: 13px; color: #86868b; margin-bottom: 8px; font-weight: 500; padding-left: 4px; }
        select, input { width: 100%; padding: 14px; background: #fafafa; border: 1px solid #d2d2d7; border-radius: 12px; color: #1d1d1f; font-size: 16px; margin-bottom: 18px; box-sizing: border-box; outline: none; transition: border 0.3s; }
        select:focus, input:focus { border-color: var(--apple-blue); }
        #go { width: 100%; padding: 18px; background: var(--apple-blue); color: #fff; border: none; border-radius: 16px; font-size: 18px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        #go:active { opacity: 0.8; }
        #res { display: none; margin-top: 25px; background: #fff; border-radius: 24px; padding: 25px; border: 1px solid #e5e5e7; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .finance-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
        .finance-table th { background: #fbfbfd; padding: 12px 5px; color: #86868b; font-weight: 500; border-bottom: 1px solid #eee; }
        .finance-table td { padding: 14px 5px; text-align: center; border-bottom: 1px solid #f5f5f7; }
        .model-name { font-weight: 700; color: var(--text-dark); text-align: left !important; padding-left: 10px !important; }
        .price-tag { color: #d70015; font-weight: 600; }
        .daily-blue { color: var(--apple-blue); font-weight: 800; font-size: 15px; }
        
        #ai-output { font-size: 15px; line-height: 1.8; color: #3a3a3c; text-align: justify; border-top: 1px solid #f2f2f2; padding-top: 20px; }
        .quote { font-style: italic; color: var(--apple-blue); font-weight: 600; margin-top: 18px; display: block; text-align: center; font-size: 13px; }
        
        /* 特別修正：API Key 填寫區 */
        .admin-section { margin-top: 40px; padding: 15px; border-top: 2px dashed #d2d2d7; }
        .admin-section label { color: #b0b0b5; }
        #apiKey { background: #fff; border: 1px solid #e5e5e7; font-size: 10px; color: #333; }
    </style>
</head>
<body>

<div class="box">
    <h2>舊換新回收建議</h2>
    <div class="card">
        <label>鑑定舊機型號</label>
        <select id="m">
            <optgroup label="iPhone 16 系列"><option>iPhone 16 Pro Max</option><option>iPhone 16 Pro</option><option>iPhone 16 Plus</option><option>iPhone 16</option></optgroup>
            <optgroup label="iPhone 15 系列"><option>iPhone 15 Pro Max</option><option>iPhone 15 Pro</option><option>iPhone 15 Plus</option><option>iPhone 15</option></optgroup>
            <optgroup label="iPhone 14 系列"><option>iPhone 14 Pro Max</option><option>iPhone 14 Pro</option><option>iPhone 14 Plus</option><option>iPhone 14</option></optgroup>
            <optgroup label="iPhone 13 系列"><option>iPhone 13 Pro Max</option><option>iPhone 13 Pro</option><option>iPhone 13</option><option>iPhone 13 mini</option></optgroup>
            <optgroup label="iPhone 12 系列"><option>iPhone 12 Pro Max</option><option>iPhone 12 Pro</option><option>iPhone 12</option><option>iPhone 12 mini</option></optgroup>
            <optgroup label="iPhone 11 系列"><option>iPhone 11 Pro Max</option><option>iPhone 11 Pro</option><option>iPhone 11</option></optgroup>
        </select>

        <label>外觀與螢幕狀態</label>
        <select id="cond">
            <option value="完美">外觀完美 / 無摔無傷</option>
            <option value="輕微使用痕跡">輕微使用痕跡 / 些微刮傷</option>
            <option value="明顯傷痕">明顯傷痕 / 邊框掉漆</option>
            <option value="螢幕或背蓋損壞">螢幕或背蓋損壞 (需維修)</option>
        </select>

        <div style="display:flex; gap:12px;">
            <div style="flex:1"><label>電池健康度 %</label><input type="number" id="ba" value="85"></div>
            <div style="flex:1"><label>舊機回收價 (NT$)</label><input type="number" id="pr" placeholder="輸入報價"></div>
        </div>
        
        <button id="go" onclick="runCheck()">開始精算升級成本</button>
    </div>

    <div id="res">
        <table class="finance-table">
            <thead>
                <tr>
                    <th style="text-align:left; padding-left:10px;">目標新機(256G)</th>
                    <th>新機原價</th>
                    <th>需補差價</th>
                    <th>每月 / 每日</th>
                </tr>
            </thead>
            <tbody id="financeBody"></tbody>
        </table>
        <div id="ai-output"></div>
        <span class="quote">「退舊不虧，換新最對」</span>
    </div>

    <div class="admin-section">
        <label>系統設定 (金鑰儲存後會自動隱藏內容)</label>
        <input type="password" id="apiKey" oninput="saveKey()" placeholder="請貼上您的 gsk_ 開頭金鑰">
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('my_groq_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
});

function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (key.startsWith('gsk_')) localStorage.setItem('my_groq_key', key);
}

async function runCheck() {
    const key = document.getElementById('apiKey').value.trim();
    const tradeIn = parseFloat(document.getElementById('pr').value);
    const cond = document.getElementById('cond').value;
    const model = document.getElementById('m').value;
    const battery = document.getElementById('ba').value;
    
    // 嚴格鎖定價格
    const models = [
        { name: "iPhone 17", price: 29900 },
        { name: "iPhone 17 Pro", price: 39900 },
        { name: "iPhone 17 PM", price: 44900 }
    ];

    if(!tradeIn || !key) return alert("請輸入回收價，並確認最下方的金鑰已填寫。");

    const tbody = document.getElementById('financeBody');
    tbody.innerHTML = "";
    let proDaily = 0;

    models.forEach(m => {
        const gap = m.price - tradeIn;
        const monthly = Math.round(gap / 12);
        const daily = Math.round(gap / 365);
        if(m.name === "iPhone 17 Pro") proDaily = daily;
        
        tbody.innerHTML += `
            <tr>
                <td class="model-name">${m.name}</td>
                <td>$${m.price.toLocaleString()}</td>
                <td class="price-tag">$${gap.toLocaleString()}</td>
                <td>$${monthly.toLocaleString()} / <span class="daily-blue">$${daily}</span></td>
            </tr>
        `;
    });

    document.getElementById('res').style.display = "block";
    const output = document.getElementById('ai-output');
    output.innerText = "資產顧問分析中...";

    const prompt = `你是專業資產顧問。客戶持有 ${model}，外觀 ${cond}，電池 ${battery}%，回收價 ${tradeIn}元。
    請嚴格運用以下五大觀念：
    1. 閒置即虧損：舊手機沒人使用就無法賦於價值，就像「米酒瓶」只留著空瓶不拿去換新米酒，就只是佔空間。
    2. 價值活化：強調現在回收是「止血」，將舊資產轉化為 iPhone 17 的升級資金。
    3. 費用感官：升級 iPhone 17 Pro 每天僅需 $${proDaily}，就像一杯飲料錢換來全新保固與 AI 生產力。
    4. 備用機迷思：舊機久放必壞（電池膨脹、螢幕老化），現在處分才是最聰明的決定。
    5. 給家人的迷思：引用 Adam 觀點，給家人一台變慢、電池不好的舊機不是愛，而是給他們麻煩。
    請用 180 字內、專業誠懇的繁體中文回答，強調「使用才賦予價值」。`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: prompt }] })
        });
        const data = await response.json();
        output.innerText = data.choices[0].message.content;
    } catch (e) { output.innerText = "系統連線異常，請檢查金鑰。"; }
}
</script>
</body>
</html>
